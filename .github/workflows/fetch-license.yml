name: Fetch canonical GPLv3 license

on:
  push:
    branches:
      - agent/full-gpl-license

permissions:
  contents: write

jobs:
  replace-license:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-gpl-license
      - name: Replace LICENSE with canonical GPL-3.0-only text
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/spdx/license-list-data/main/text/GPL-3.0-only.txt \
            --output LICENSE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LICENSE
          git commit -m "Use canonical GPLv3 license text"
          git push origin HEAD:agent/full-gpl-license
