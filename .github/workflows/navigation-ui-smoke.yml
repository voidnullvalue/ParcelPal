name: Navigation UI smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  navigation-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android build and emulator packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify published 1.0.4 release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view v1.0.4-92e21ea7c64a --json tagName,isPrerelease,assets,url > /tmp/release.json
          jq -e '.tagName == "v1.0.4-92e21ea7c64a" and .isPrerelease == false' /tmp/release.json
          jq -e '[.assets[].name] | index("ParcelPal-1.0.4-92e21ea7c64a-debug.apk") != null' /tmp/release.json
          jq -e '[.assets[].name] | index("ParcelPal-1.0.4-92e21ea7c64a-debug.apk.sha256") != null' /tmp/release.json

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run navigation regression in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash tools/navigation-ui-smoke.sh
