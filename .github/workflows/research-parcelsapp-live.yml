name: Research ParcelsApp live protocol

on:
  push:
    branches:
      - research/parcelsapp-protocol-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Capture and verify browser protocol
        run: |
          cat > probe.mjs <<'EOF'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const tracking = ['92055902', '6733880000', '68080083'].join('');
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 412, height: 915 },
            locale: 'en-US',
            timezoneId: 'America/Chicago',
            isMobile: true,
            hasTouch: true
          });

          function sanitizeRequest(request) {
            if (!request) return null;
            const params = new URLSearchParams(request.postData || '');
            const fields = {};
            for (const [key, value] of params.entries()) {
              fields[key] = key.toLowerCase().includes('tracking') ? '<redacted>' : value;
            }
            return {
              method: request.method,
              url: request.url,
              fieldNames: [...params.keys()],
              fields
            };
          }

          async function probe(name, url) {
            const page = await context.newPage();
            let capturedRequest = null;
            let capturedResponse = null;
            page.on('request', request => {
              if (request.url().includes('/api/v2/parcels')) {
                capturedRequest = {
                  method: request.method(),
                  url: request.url(),
                  postData: request.postData() || ''
                };
              }
            });
            page.on('response', async response => {
              if (response.url().includes('/api/v2/parcels')) {
                capturedResponse = {
                  status: response.status(),
                  contentType: response.headers()['content-type'] || '',
                  body: await response.text()
                };
              }
            });

            let uiError = null;
            try {
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              const trackingInput = page.locator('input[placeholder*="tracking" i], input[name*="tracking" i], input[type="search"], input[type="text"]').first();
              await trackingInput.waitFor({ state: 'visible', timeout: 30000 });
              await trackingInput.fill(tracking);
              const submit = page.locator('button[type="submit"], input[type="submit"], button').filter({ hasText: /track/i }).first();
              await submit.waitFor({ state: 'visible', timeout: 30000 });
              await submit.click();
              for (let i = 0; i < 90 && !capturedResponse; i++) await page.waitForTimeout(500);
            } catch (error) {
              uiError = String(error?.message || error).split('\n')[0];
            }

            let parsed = null;
            let parseError = null;
            if (capturedResponse) {
              try { parsed = JSON.parse(capturedResponse.body); }
              catch (error) { parseError = String(error?.message || error); }
            }
            const states = Array.isArray(parsed?.states) ? parsed.states : [];
            const services = Array.isArray(parsed?.services) ? parsed.services : [];
            const result = {
              name,
              pageUrl: url,
              uiError,
              request: sanitizeRequest(capturedRequest),
              responseStatus: capturedResponse?.status ?? null,
              responseContentType: capturedResponse?.contentType ?? null,
              responseError: parsed?.error ?? null,
              responseKeys: parsed ? Object.keys(parsed) : [],
              parseError,
              stateCount: states.length,
              serviceCount: services.length,
              services: services.map((service, index) => ({ index, slug: service?.slug, name: service?.name })),
              detected: parsed?.detected,
              correctIdPresent: Boolean(parsed?.correctId)
            };
            await page.close();
            return result;
          }

          const results = [
            await probe('auto', 'https://parcelsapp.com/en'),
            await probe('usps-carrier-page', 'https://parcelsapp.com/en/carriers/usps')
          ];
          fs.writeFileSync('parcelsapp-protocol-sanitized.json', JSON.stringify(results, null, 2));
          console.log(JSON.stringify(results, null, 2));
          await browser.close();

          if (!results.some(result => result.stateCount > 0)) {
            throw new Error('Neither public browser flow returned tracking states');
          }
          EOF
          node probe.mjs

      - name: Upload sanitized protocol capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parcelsapp-live-protocol-sanitized
          path: parcelsapp-protocol-sanitized.json
          if-no-files-found: warn
          retention-days: 2
