name: Research USPS live tracking protocol

on:
  push:
    branches:
      - research/parcelsapp-protocol-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Camoufox
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'camoufox[geoip]'
          python -m camoufox fetch

      - name: Verify USPS live tracking
        run: |
          cat > probe.py <<'EOF'
          import asyncio
          import json
          import re
          from urllib.parse import urlparse
          from camoufox.async_api import AsyncCamoufox

          TRACKING = ''.join(('92055902', '6733880000', '68080083'))
          URL = f'https://tools.usps.com/go/TrackConfirmAction?tLabels={TRACKING}'

          def allowed(url: str) -> bool:
              parsed = urlparse(url)
              if parsed.scheme in ('about', 'data', 'blob'):
                  return True
              host = (parsed.hostname or '').lower()
              return parsed.scheme == 'https' and (host == 'usps.com' or host.endswith('.usps.com'))

          async def main():
              async with AsyncCamoufox(headless=True) as browser:
                  context = await browser.new_context(locale='en-US', timezone_id='America/Chicago')
                  allowed_hosts = set()
                  blocked_hosts = set()

                  async def route_request(route):
                      host = (urlparse(route.request.url).hostname or '').lower()
                      if allowed(route.request.url):
                          if host:
                              allowed_hosts.add(host)
                          await route.continue_()
                      else:
                          if host:
                              blocked_hosts.add(host)
                          await route.abort()

                  await context.route('**/*', route_request)
                  page = await context.new_page()
                  await page.goto(URL, wait_until='domcontentloaded', timeout=60000)
                  try:
                      await page.wait_for_selector(
                          '.tb-step, .update-banner-wrapper, .banner-content, .tb-status',
                          timeout=40000,
                      )
                  except Exception:
                      pass
                  await asyncio.sleep(3)

                  title = await page.title()
                  body = await page.locator('body').inner_text()
                  status_nodes = await page.locator('.tb-status').all_inner_texts()
                  step_nodes = await page.locator('.tb-step').all_inner_texts()
                  detail_nodes = await page.locator('.tb-status-detail').all_inner_texts()
                  banner_nodes = await page.locator(
                      '.latest-update-banner-wrapper, .update-banner-wrapper, .banner-content'
                  ).all_inner_texts()

                  challenge = any(marker in title.lower() for marker in (
                      'access denied', 'please verify', 'are you a robot', 'captcha', 'blocked', 'just a moment'
                  ))
                  credible = bool(status_nodes or step_nodes or detail_nodes or banner_nodes)

                  output = {
                      'httpUrl': page.url.replace(TRACKING, '<tracking>'),
                      'title': title,
                      'challenge': challenge,
                      'credible': credible,
                      'statusNodeCount': len(status_nodes),
                      'stepNodeCount': len(step_nodes),
                      'detailNodeCount': len(detail_nodes),
                      'bannerNodeCount': len(banner_nodes),
                      'bodyHasKnownStatusLanguage': bool(re.search(
                          r'delivered|moving through network|in transit|pre-shipment|awaiting item|tracking history',
                          body,
                          re.I,
                      )),
                      'bodyLength': len(body),
                      'allowedHosts': sorted(allowed_hosts),
                      'blockedHosts': sorted(blocked_hosts),
                  }
                  with open('usps-live-verification.json', 'w', encoding='utf-8') as handle:
                      json.dump(output, handle, indent=2)
                  print(json.dumps(output, indent=2))

                  if challenge:
                      raise RuntimeError('USPS returned a bot challenge')
                  if not credible:
                      raise RuntimeError('USPS page did not expose tracking status nodes with third-party requests blocked')

          asyncio.run(main())
          EOF
          xvfb-run -a python probe.py

      - name: Upload sanitized verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: usps-live-verification
          path: usps-live-verification.json
          if-no-files-found: warn
          retention-days: 1
