name: Research USPS live tracking protocol

on:
  push:
    branches:
      - research/parcelsapp-protocol-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Camoufox
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'camoufox[geoip]'
          python -m camoufox fetch

      - name: Verify exact production extraction script against USPS
        run: |
          cat > probe.py <<'EOF'
          import asyncio
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          from camoufox.async_api import AsyncCamoufox

          TRACKING = ''.join(('92055902', '6733880000', '68080083'))
          URL = f'https://tools.usps.com/go/TrackConfirmAction?tLabels={TRACKING}'
          SCRIPT = Path('app/src/main/assets/usps_extract.js').read_text(encoding='utf-8')

          def allowed(url: str) -> bool:
              parsed = urlparse(url)
              if parsed.scheme in ('about', 'data', 'blob'):
                  return True
              host = (parsed.hostname or '').lower()
              return parsed.scheme == 'https' and (host == 'usps.com' or host.endswith('.usps.com'))

          async def main():
              async with AsyncCamoufox(headless=True) as browser:
                  context = await browser.new_context(locale='en-US', timezone_id='America/Chicago')
                  allowed_hosts = set()
                  blocked_hosts = set()

                  async def route_request(route):
                      host = (urlparse(route.request.url).hostname or '').lower()
                      if allowed(route.request.url):
                          if host:
                              allowed_hosts.add(host)
                          await route.continue_()
                      else:
                          if host:
                              blocked_hosts.add(host)
                          await route.abort()

                  await context.route('**/*', route_request)
                  page = await context.new_page()
                  await page.goto(URL, wait_until='domcontentloaded', timeout=60000)

                  extracted = None
                  for _ in range(80):
                      raw = await page.evaluate(SCRIPT)
                      extracted = json.loads(raw)
                      if extracted.get('ready') or extracted.get('challenge'):
                          break
                      await asyncio.sleep(0.5)

                  output = {
                      'httpUrl': page.url.replace(TRACKING, '<tracking>'),
                      'version': extracted.get('version') if extracted else None,
                      'ready': bool(extracted and extracted.get('ready')),
                      'challenge': bool(extracted and extracted.get('challenge')),
                      'statusPresent': bool(extracted and extracted.get('status')),
                      'stepCount': len(extracted.get('steps', [])) if extracted else 0,
                      'detailCount': len(extracted.get('details', [])) if extracted else 0,
                      'bannerCount': len(extracted.get('banners', [])) if extracted else 0,
                      'allowedHosts': sorted(allowed_hosts),
                      'blockedHosts': sorted(blocked_hosts),
                  }
                  Path('usps-live-verification.json').write_text(json.dumps(output, indent=2), encoding='utf-8')
                  print(json.dumps(output, indent=2))

                  if output['challenge']:
                      raise RuntimeError('USPS returned a challenge')
                  if not output['ready'] or not output['statusPresent'] or output['stepCount'] < 1:
                      raise RuntimeError('Production extraction script did not return usable live USPS data')

          asyncio.run(main())
          EOF
          xvfb-run -a python probe.py

      - name: Upload sanitized verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: usps-live-verification
          path: usps-live-verification.json
          if-no-files-found: warn
          retention-days: 1
