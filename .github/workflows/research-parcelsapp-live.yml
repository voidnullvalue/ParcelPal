name: Research USPS live tracking protocol

on:
  push:
    branches:
      - research/parcelsapp-protocol-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install browser driver
        run: npm install --no-save playwright-core@1.54.2

      - name: Capture USPS browser protocol
        run: |
          cat > probe.mjs <<'EOF'
          import fs from 'node:fs';
          import { chromium } from 'playwright-core';

          const tracking = ['92055902', '6733880000', '68080083'].join('');
          const executablePath = fs.existsSync('/usr/bin/google-chrome')
            ? '/usr/bin/google-chrome'
            : '/usr/bin/chromium-browser';
          const browser = await chromium.launch({
            headless: true,
            executablePath,
            args: ['--no-sandbox', '--disable-dev-shm-usage']
          });
          const context = await browser.newContext({
            viewport: { width: 412, height: 915 },
            locale: 'en-US',
            timezoneId: 'America/Chicago',
            isMobile: true,
            hasTouch: true
          });
          const page = await context.newPage();
          const captures = [];

          function redact(text) {
            return String(text || '')
              .split(tracking).join('<tracking>')
              .replace(/\b\d{5}(?:-\d{4})?\b/g, '<postal-code>');
          }

          page.on('response', async response => {
            const request = response.request();
            const type = request.resourceType();
            const url = response.url();
            if (!/usps\.com/i.test(url)) return;
            if (!['xhr', 'fetch', 'document'].includes(type)) return;
            const contentType = response.headers()['content-type'] || '';
            let body = '';
            try {
              if (/json|text|html|javascript/i.test(contentType)) body = await response.text();
            } catch {}
            captures.push({
              url: redact(url),
              method: request.method(),
              resourceType: type,
              status: response.status(),
              contentType,
              requestBody: redact(request.postData() || '').slice(0, 20000),
              responseBody: redact(body).slice(0, 500000)
            });
          });

          const urls = [
            `https://tools.usps.com/go/TrackConfirmAction_input?origTrackNum=${encodeURIComponent(tracking)}`,
            `https://tools.usps.com/go/TrackConfirmAction?tRef=fullpage&tLc=2&text28777=&tLabels=${encodeURIComponent(tracking)}`
          ];

          let loaded = false;
          let bodyText = '';
          let lastError = null;
          for (const url of urls) {
            try {
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(10000);
              bodyText = redact(await page.locator('body').innerText()).slice(0, 100000);
              if (/tracking history|moving through network|delivered|in transit|pre-shipment|awaiting item|status/i.test(bodyText)) {
                loaded = true;
                break;
              }
            } catch (error) {
              lastError = String(error?.message || error).split('\n')[0];
            }
          }

          const output = {
            loaded,
            lastError,
            finalUrl: redact(page.url()),
            bodyText,
            captures
          };
          fs.writeFileSync('usps-live-capture.json', JSON.stringify(output, null, 2));
          console.log(JSON.stringify({
            loaded,
            lastError,
            finalUrl: output.finalUrl,
            bodyContainsTrackingHistory: /tracking history/i.test(bodyText),
            bodyContainsStatusLanguage: /moving through network|delivered|in transit|pre-shipment|awaiting item/i.test(bodyText),
            captures: captures.map(({ url, method, resourceType, status, contentType, requestBody, responseBody }) => ({
              url, method, resourceType, status, contentType,
              requestBodyLength: requestBody.length,
              responseBodyLength: responseBody.length
            }))
          }, null, 2));
          await browser.close();
          if (!loaded) throw new Error('USPS first-party page did not render tracking status');
          EOF
          node probe.mjs

      - name: Upload private diagnostic capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: usps-live-protocol-capture
          path: usps-live-capture.json
          if-no-files-found: warn
          retention-days: 1
