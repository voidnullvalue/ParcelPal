name: Capture 1ST tracking requests

on:
  push:
    branches:
      - research/1st-live-validation
  pull_request:
    branches:
      - fix/1st-carrier-detection

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install browser client
        run: npm install --no-save playwright-core@1.55.0
      - name: Capture ParcelsApp request
        run: node tools/capture-parcelsapp-1st.mjs
      - name: Capture official 1ST request
        run: node tools/capture-1st-official.mjs
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 1st-tracking-captures
          path: |
            /tmp/parcelsapp-1st-capture.txt
            /tmp/parcelsapp-1st.png
            /tmp/1st-official-capture.txt
            /tmp/1st-official.png
          if-no-files-found: warn
          retention-days: 1
